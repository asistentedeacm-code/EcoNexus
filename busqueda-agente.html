<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  
  <title>Directorio de Agentes | EcoNexus</title>
  <meta name="description" content="Encuentra a los mejores asesores inmobiliarios y realtors en Venezuela a través de EcoNexus." />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    .hide-scrollbars::-webkit-scrollbar { display: none; }
    .hide-scrollbars { -ms-overflow-style: none; scrollbar-width: none; }
    /* Estrellas doradas */
    .star-rating { color: #F59E0B; }
  </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { econexus: { DEFAULT: '#1E3F20', dark: '#142B16', light: '#2E5E32', accent: '#388E3C', soft: '#F4F7F4' } } } } }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col overflow-x-hidden">

  <!-- HEADER RESPONSIVO -->
  <header class="bg-econexus text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-3 py-3 flex flex-wrap justify-between items-center gap-y-3">
      <!-- Logo y Textos -->
      <div class="flex items-center space-x-2.5 cursor-pointer flex-shrink-0" onclick="window.location.href='index.html'">
        <img src="logo.png.png" alt="EcoNexus Logo" class="h-9 md:h-10 w-auto object-contain drop-shadow" onerror="this.src='logo.png'" />
        <div class="flex flex-col">
          <span class="text-xl md:text-2xl font-extrabold tracking-wide text-white leading-none">EcoNexus</span>
          <span class="text-[9px] md:text-[11px] text-green-200 tracking-wider font-light mt-0.5 leading-none">DIRECTORIO DE AGENTES</span>
        </div>
      </div>
      <!-- Controles -->
      <div class="flex items-center gap-2 sm:gap-4 ml-auto">
        <button onclick="window.location.href='index.html'" class="text-green-100 hover:text-white text-[10px] md:text-xs font-semibold flex flex-col items-center transition cursor-pointer group">
          <i class="fa-solid fa-house-chimney text-sm md:text-base mb-0.5 group-hover:scale-110 transition-transform"></i> Inmuebles
        </button>
      </div>
    </div>
  </header>

  <!-- BANNER HERO -->
  <section class="bg-econexus-soft border-b border-green-200 py-8 px-4">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-xl md:text-3xl font-extrabold text-econexus mb-2">Encuentra a tu <span class="text-green-600">Realtor Ideal</span></h1>
      <p class="text-gray-600 text-xs md:text-sm font-medium">Contacta directamente con asesores evaluados por nuestra comunidad.</p>
    </div>
  </section>

  <!-- BÚSQUEDA DE AGENTES -->
  <section class="max-w-7xl mx-auto px-4 py-5 w-full">
    <div class="bg-white rounded-xl p-2.5 shadow-sm border border-gray-100 flex relative">
        <i class="fa-solid fa-magnifying-glass absolute left-5 top-5 text-gray-400"></i>
        <input type="text" id="filtroAgentes" onkeyup="filtrarAgentes(this.value)" placeholder="Buscar por nombre o agencia..." class="w-full bg-gray-50 border border-gray-200 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-econexus transition" />
    </div>
  </section>

  <!-- GRILLA DE AGENTES RESPONSIVA (2 en Celulares, 3 Tablets, 4 en PC) -->
  <main class="max-w-7xl mx-auto px-4 pb-16 flex-grow w-full">
    
    <div id="loadingSpinner" class="text-center py-20">
      <i class="fa-solid fa-circle-notch fa-spin text-4xl text-econexus mb-3"></i>
      <p class="text-gray-500 text-sm font-medium">Sincronizando perfiles...</p>
    </div>
    
    <div id="gridAgentes" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4 hidden">
        <!-- Generado por JS -->
    </div>

    <div id="noResults" class="hidden text-center py-16 bg-white rounded-2xl border border-gray-100 shadow-sm mt-4">
      <i class="fa-solid fa-users-slash text-4xl text-gray-300 mb-4"></i>
      <h3 class="text-lg font-bold text-gray-700 mb-1">No hay agentes encontrados</h3>
    </div>
  </main>

  <!-- MODAL DE DATOS DEL AGENTE Y RESEÑAS -->
  <div id="modalAgente" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-[70] flex items-center justify-center p-3 md:p-4 hidden overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative">
      <button onclick="cerrarModalAgente()" class="absolute top-3 right-3 z-[80] bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-full w-8 h-8 flex items-center justify-center transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
      
      <div class="p-6 md:p-8" id="modalAgenteContent">
        <!-- Contenido Inyectado Dinámicamente -->
      </div>
    </div>
  </div>

  <!-- PIE DE PÁGINA -->
  <footer class="bg-econexus-dark text-white py-6 mt-auto border-t border-green-900">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <p class="text-[10px] text-green-300 mb-1">EcoNexus Real Estate Platform</p>
      <p class="text-[10px] text-gray-400">© 2026 Todos los derechos reservados.</p>
    </div>
  </footer>

  <script>
    // Conexión a Supabase
    const SUPABASE_URL = 'https://gvcklmqldswxfweliuio.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Yu3I-FpcjU44dHsPs9pPDQ_9TEC9fKa';
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let todosLosAgentes = [];
    let reseñasGlobales = [];
    let agenteActivoModal = null;
    let puntajeSeleccionado = 5;

    document.addEventListener("DOMContentLoaded", async function() {
      await cargarDatosDirectorio();
    });

    async function cargarDatosDirectorio() {
      try {
        // 1. Extraemos TODOS los agentes desde la tabla PERFILES directamente
        const { data: perfiles, error: errPerfiles } = await dbClient.from('perfiles').select('*');
        if (errPerfiles) throw errPerfiles;

        // 2. Extraemos TODAS las reseñas públicas
        const { data: reseñas, error: errResenas } = await dbClient.from('resenas_agentes').select('*');
        if (errResenas) throw errResenas;
        reseñasGlobales = reseñas || [];

        // 3. Cruzar Datos y Calcular Promedios
        const agentesMapeados = [];
        
        if (perfiles) {
            perfiles.forEach(p => {
                const esAgencia = p.tipo_asesor && p.tipo_asesor.trim().toLowerCase() !== 'independiente' && p.nombre_agencia && p.nombre_agencia.trim() !== '';
                const agenciaDisplay = esAgencia ? p.nombre_agencia : "Agente Independiente";
                
                // Filtrar reseñas de este agente
                const resenasAgente = reseñasGlobales.filter(r => r.agente_id === p.id);
                const totalResenas = resenasAgente.length;
                const promedio = totalResenas > 0 ? (resenasAgente.reduce((acc, curr) => acc + curr.puntuacion, 0) / totalResenas) : 0;
                
                agentesMapeados.push({
                    id: p.id,
                    nombre: p.nombre_agente || "Asesor Inmobiliario",
                    telefono: p.telefono ? p.telefono.replace(/[^0-9]/g, '') : '',
                    foto: p.foto_perfil || '',
                    sobreMi: p.sobre_mi || 'Asesor Inmobiliario registrado en la red EcoNexus.',
                    esAgencia: esAgencia,
                    agenciaDisplay: agenciaDisplay,
                    promedio: promedio,
                    porcentaje: (promedio / 5) * 100,
                    totalResenas: totalResenas,
                    resenas: resenasAgente
                });
            });
        }

        // 4. Ordenar: Primero los de mayor puntuación (Lógica de posicionamiento)
        todosLosAgentes = agentesMapeados.sort((a, b) => b.promedio - a.promedio || b.totalResenas - a.totalResenas);
        
        document.getElementById("loadingSpinner").classList.add("hidden");
        renderizarAgentes(todosLosAgentes);

      } catch (err) {
        console.error("Error cargando directorio:", err);
        document.getElementById("loadingSpinner").innerHTML = `<p class="text-red-500 text-sm">Error conectando con la red.</p>`;
      }
    }

    // Funciones de Lógica Visual (Estrellas Inteligentes)
    function generarEstrellasHTML(promedio) {
        let html = '';
        for (let i = 1; i <= 5; i++) {
            if (promedio >= i) {
                html += '<i class="fa-solid fa-star"></i>'; // Completa
            } else if (promedio >= i - 0.5) {
                html += '<i class="fa-solid fa-star-half-stroke"></i>'; // Media
            } else {
                html += '<i class="fa-regular fa-star text-gray-300"></i>'; // Vacía
            }
        }
        return html;
    }

    function renderizarAgentes(lista) {
        const grid = document.getElementById("gridAgentes");
        const noResults = document.getElementById("noResults");
        
        grid.innerHTML = "";
        
        if (lista.length === 0) {
            grid.classList.add("hidden"); noResults.classList.remove("hidden"); return;
        }

        noResults.classList.add("hidden"); grid.classList.remove("hidden");

        lista.forEach(agente => {
            const badgeClass = agente.esAgencia ? "bg-econexus-soft text-econexus border-green-200" : "bg-gray-100 text-gray-600 border-gray-200";
            
            const fotoHTML = agente.foto 
                ? `<img src="${agente.foto}" alt="${agente.nombre}" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full object-cover border-4 border-gray-50 shadow-sm mx-auto mb-3" />`
                : `<div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-econexus-soft text-econexus flex items-center justify-center font-bold text-3xl border-4 border-gray-50 shadow-sm mx-auto mb-3"><i class="fa-solid fa-user"></i></div>`;

            grid.innerHTML += `
                <div onclick="abrirModalAgente('${agente.id}')" class="bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-200 p-4 flex flex-col h-full transition duration-300 cursor-pointer">
                    <div class="text-center flex-grow">
                        ${fotoHTML}
                        <h3 class="font-bold text-gray-900 text-xs md:text-sm leading-tight mb-1 truncate">${agente.nombre}</h3>
                        <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[9px] font-bold uppercase border ${badgeClass} mt-1 mb-2 truncate max-w-full">
                            <i class="fa-solid fa-building-user"></i> <span class="truncate">${agente.agenciaDisplay}</span>
                        </div>
                        <div class="flex flex-col items-center justify-center gap-0.5 mt-2">
                            <div class="star-rating text-xs">${generarEstrellasHTML(agente.promedio)}</div>
                            <span class="text-[10px] text-gray-500 font-bold">${agente.promedio.toFixed(1)}/5 (${agente.totalResenas} reseñas)</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function filtrarAgentes(texto) {
        const query = texto.toLowerCase().trim();
        const filtrados = todosLosAgentes.filter(a => 
            a.nombre.toLowerCase().includes(query) || a.agenciaDisplay.toLowerCase().includes(query)
        );
        renderizarAgentes(filtrados);
    }

    // MODAL DEL AGENTE Y SISTEMA DE RESEÑAS
    function abrirModalAgente(id) {
        agenteActivoModal = todosLosAgentes.find(a => a.id === id);
        if(!agenteActivoModal) return;

        const msjWA = encodeURIComponent(`Hola ${agenteActivoModal.nombre}, requiero tus servicios como realtor.`);
        const urlWA = agenteActivoModal.telefono ? `https://wa.me/${agenteActivoModal.telefono}?text=${msjWA}` : '#';
        
        let htmlResenas = '';
        if(agenteActivoModal.resenas.length > 0) {
            agenteActivoModal.resenas.forEach(r => {
                htmlResenas += `
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 mb-2">
                    <div class="star-rating text-[10px] mb-1">${generarEstrellasHTML(r.puntuacion)}</div>
                    <p class="text-xs text-gray-700 italic">"${r.comentario}"</p>
                </div>`;
            });
        } else {
            htmlResenas = `<p class="text-xs text-gray-400 text-center py-4">Aún no hay reseñas. ¡Sé el primero en calificar!</p>`;
        }

        const badgeClass = agenteActivoModal.esAgencia ? "bg-econexus-soft text-econexus border-green-200" : "bg-gray-100 text-gray-600 border-gray-200";
        const fotoHTML = agenteActivoModal.foto 
            ? `<img src="${agenteActivoModal.foto}" class="w-20 h-20 rounded-full object-cover border-2 border-gray-200 shadow-sm" />`
            : `<div class="w-20 h-20 rounded-full bg-econexus-soft text-econexus flex items-center justify-center font-bold text-3xl border-2 border-gray-200 shadow-sm"><i class="fa-solid fa-user"></i></div>`;

        document.getElementById("modalAgenteContent").innerHTML = `
            <div class="flex flex-col md:flex-row items-center md:items-start gap-4 mb-6 border-b border-gray-100 pb-6 text-center md:text-left">
                ${fotoHTML}
                <div class="flex-1">
                    <h2 class="text-xl md:text-2xl font-extrabold text-gray-900">${agenteActivoModal.nombre}</h2>
                    <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[10px] font-bold uppercase border ${badgeClass} mt-1 mb-2">
                        <i class="fa-solid fa-building-user"></i> ${agenteActivoModal.agenciaDisplay}
                    </div>
                    <div class="flex items-center justify-center md:justify-start gap-2">
                        <div class="star-rating text-sm">${generarEstrellasHTML(agenteActivoModal.promedio)}</div>
                        <span class="text-xs font-bold text-gray-600">${agenteActivoModal.porcentaje.toFixed(0)}% Reputación Positiva</span>
                    </div>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-sm font-bold text-gray-900 mb-2">Sobre Mí</h3>
                <p class="text-xs md:text-sm text-gray-600 leading-relaxed whitespace-pre-line">${agenteActivoModal.sobreMi}</p>
            </div>

            <!-- Botón de Contacto Exonerado -->
            <div class="mb-8">
                <p class="text-[10px] text-gray-500 mb-2 leading-tight text-center md:text-left">*Al hacer clic en contactar, asume la total responsabilidad de las negociaciones, exonerando a EcoNexus de los acuerdos pactados.</p>
                <button onclick="window.open('${urlWA}', '_blank')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Contactar Realtor
                </button>
            </div>

            <!-- Sección de Reseñas -->
            <div class="bg-white rounded-xl border border-gray-200 p-4 mb-4">
                <h3 class="text-sm font-bold text-gray-900 mb-3 border-b border-gray-100 pb-2">Dejar una Reseña</h3>
                
                <div class="flex items-center gap-2 mb-3" id="selectorEstrellas">
                    <span class="text-xs font-bold text-gray-700">Puntuación:</span>
                    <div class="star-rating text-lg cursor-pointer flex gap-1">
                        <i class="fa-solid fa-star" onclick="seleccionarEstrellas(1)"></i>
                        <i class="fa-solid fa-star" onclick="seleccionarEstrellas(2)"></i>
                        <i class="fa-solid fa-star" onclick="seleccionarEstrellas(3)"></i>
                        <i class="fa-solid fa-star" onclick="seleccionarEstrellas(4)"></i>
                        <i class="fa-solid fa-star" onclick="seleccionarEstrellas(5)"></i>
                    </div>
                </div>
                
                <textarea id="textoResena" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-xs focus:outline-none focus:ring-2 focus:ring-econexus mb-3 resize-none h-20" placeholder="¿Cómo fue tu experiencia con este agente? (Opcional)"></textarea>
                
                <button onclick="enviarResena()" class="w-full bg-gray-900 hover:bg-black text-white text-xs font-bold py-2.5 rounded-xl transition">
                    Calificar Agente
                </button>
            </div>

            <div>
                <h3 class="text-sm font-bold text-gray-900 mb-3">Reseñas de la Comunidad (${agenteActivoModal.totalResenas})</h3>
                <div class="max-h-48 overflow-y-auto pr-2">
                    ${htmlResenas}
                </div>
            </div>
        `;
        puntajeSeleccionado = 5;
        document.getElementById("modalAgente").classList.remove("hidden");
    }

    function cerrarModalAgente() { document.getElementById("modalAgente").classList.add("hidden"); agenteActivoModal = null; }

    function seleccionarEstrellas(valor) {
        puntajeSeleccionado = valor;
        const contenedor = document.getElementById("selectorEstrellas").querySelectorAll("i");
        contenedor.forEach((estrella, index) => {
            if (index < valor) {
                estrella.classList.remove("fa-regular", "text-gray-300");
                estrella.classList.add("fa-solid");
            } else {
                estrella.classList.remove("fa-solid");
                estrella.classList.add("fa-regular", "text-gray-300");
            }
        });
    }

    // Filtro de Seguridad: Sanitización XSS + Palabras Obscenas
    function sanitizarYFiltrarTexto(texto) {
        if (!texto) return "";
        // 1. Escapar HTML (Previene XSS)
        let limpio = texto.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        // 2. Diccionario básico de palabras obscenas a censurar
        const groserias = ['mierda', 'puta', 'cabron', 'estafa', 'estafador', 'maldito', 'robo', 'ladron']; 
        groserias.forEach(g => {
            const regex = new RegExp(`\\b${g}s?\\b`, 'gi');
            limpio = limpio.replace(regex, '***');
        });
        return limpio;
    }

    async function enviarResena() {
        if (!agenteActivoModal) return;
        
        const btn = event.target;
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Enviando...`;

        const textoCrudo = document.getElementById("textoResena").value;
        const textoSeguro = sanitizarYFiltrarTexto(textoCrudo);

        try {
            // Ejecutamos la Función SQL que captura la IP de los Headers automáticamente
            const { error } = await dbClient.rpc('agregar_resena_segura', {
                p_agente_id: agenteActivoModal.id,
                p_puntuacion: puntajeSeleccionado,
                p_comentario: textoSeguro
            });

            if (error) {
                // Si la BD rebota el intento porque viola el UNIQUE de (agente_id, ip_cliente)
                if (error.message.includes('unique constraint') || error.code === '23505') {
                    alert("Ya calificaste a este agente anteriormente.");
                } else {
                    alert("Error al enviar la reseña. Intenta de nuevo.");
                }
                throw error;
            }

            alert("¡Reseña guardada con éxito!");
            cerrarModalAgente();
            
            // Recargar datos en segundo plano para actualizar estrellas
            document.getElementById("loadingSpinner").classList.remove("hidden");
            document.getElementById("gridAgentes").classList.add("hidden");
            await cargarDatosDirectorio();

        } catch (e) {
            btn.disabled = false;
            btn.innerHTML = `Calificar Agente`;
        }
    }
  </script>
</body>
</html>
