<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoNexus | Catálogo Inmobiliario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            econexus: { DEFAULT: '#1E3F20', dark: '#142B16', light: '#2E5E32', accent: '#388E3C', soft: '#F4F7F4' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="bg-econexus text-white py-4 px-6 shadow-md flex justify-between items-center sticky top-0 z-30">
    <div class="flex items-center space-x-3">
      <span class="text-xl font-bold tracking-wide">EcoNexus</span>
    </div>
    
    <!-- CONTADOR EN TIEMPO REAL DIRECTO DE SUPABASE -->
    <div class="flex items-center gap-2 bg-econexus-dark/80 px-3 py-1.5 rounded-full border border-green-700/50 text-xs">
      <i class="fa-solid fa-building text-amber-400"></i>
      <span class="font-medium text-gray-200">Disponibles:</span>
      <span id="contadorPropiedades" class="font-extrabold text-white bg-green-700 px-2 py-0.5 rounded-full text-xs">0</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto w-full px-4 py-6 flex-grow">
    
    <!-- BARRA DE BÚSQUEDA Y FILTROS -->
    <section class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-gray-200 mb-8">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
        <select id="filtroOperacion" onchange="aplicarFiltros()" class="border border-gray-300 rounded-xl p-2.5 text-xs md:text-sm bg-white focus:ring-2 focus:ring-econexus outline-none">
          <option value="">Todas las Operaciones</option>
          <option value="Venta">Venta</option>
          <option value="Alquiler">Alquiler</option>
        </select>

        <input type="text" id="filtroTipo" oninput="aplicarFiltrosConDebounce()" placeholder="Tipo (Ej: Apartamento, Galpón)" class="border border-gray-300 rounded-xl p-2.5 text-xs md:text-sm focus:ring-2 focus:ring-econexus outline-none">

        <input type="text" id="filtroUbicacion" oninput="aplicarFiltrosConDebounce()" placeholder="Ubicación (Ej: Valencia)" class="border border-gray-300 rounded-xl p-2.5 text-xs md:text-sm focus:ring-2 focus:ring-econexus outline-none">

        <input type="text" id="filtroCodigo" oninput="aplicarFiltrosConDebounce()" placeholder="Código (Ej: ECO-1234)" class="border border-gray-300 rounded-xl p-2.5 text-xs md:text-sm focus:ring-2 focus:ring-econexus outline-none">

        <button type="button" onclick="limpiarFiltros()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-xl text-xs md:text-sm transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-filter-circle-xmark"></i> Limpiar Filtros
        </button>
      </div>
    </section>

    <!-- REJILLA DE PROPIEDADES -->
    <section id="gridPropiedades" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Las tarjetas se generan dinámicamente -->
    </section>

    <!-- ESTADO VACÍO O CARGANDO -->
    <div id="estadoMensaje" class="hidden text-center py-12">
      <i class="fa-solid fa-spinner fa-spin text-3xl text-econexus mb-3"></i>
      <p class="text-sm font-semibold text-gray-600">Cargando catálogo en tiempo real...</p>
    </div>

    <!-- BOTÓN CÁRGAR MÁS (PAGINACIÓN 12 EN 12) -->
    <div class="text-center mt-10 mb-6">
      <button id="btnCargarMas" onclick="cargarMasPropiedades()" class="hidden bg-econexus hover:bg-econexus-light text-white font-bold py-3 px-8 rounded-xl text-sm transition shadow-md items-center gap-2 mx-auto">
        <span>Cargar más inmuebles</span>
        <i class="fa-solid fa-chevron-down"></i>
      </button>
    </div>

  </main>

  <!-- MODAL DE DETALLE DEL INMUEBLE -->
  <div id="modalDetalle" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl relative flex flex-col">
      <button onclick="cerrarModalDetalle()" class="absolute top-3 right-3 bg-gray-900/60 hover:bg-gray-900 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold z-20 transition">
        &times;
      </button>
      
      <div id="contenidoModalDetalle" class="p-6 space-y-4">
        <!-- Generado dinámicamente -->
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-econexus-dark text-white py-6 px-4 text-center text-xs border-t border-green-900">
    <p>&copy; 2026 EcoNexus - Red Inmobiliaria Inteligente. Todos los derechos reservados.</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://gvcklmqldswxfweliuio.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Yu3I-FpcjU44dHsPs9pPDQ_9TEC9fKa';
    
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const LIMITE_POR_PAGINA = 12;
    let paginaActual = 0;
    let hayMasRegistros = true;
    let cargandoData = false;
    let debounceTimer = null;

    // Inicialización al cargar el documento
    document.addEventListener('DOMContentLoaded', () => {
      // Leer parámetros directos de la URL si los hay (por ejemplo: ?codigo=ECO-1234 o ?asesor=58412...)
      const params = new URLSearchParams(window.location.search);
      if (params.get('codigo')) document.getElementById('filtroCodigo').value = params.get('codigo');
      
      inicializarCatalogo();
    });

    async function inicializarCatalogo() {
      paginaActual = 0;
      hayMasRegistros = true;
      document.getElementById('gridPropiedades').innerHTML = '';
      
      // 1. Obtener conteo total directo en Supabase sin traer filas (Ultra liviano)
      await consultarTotalContadorSupabase();
      
      // 2. Cargar el primer lote de 12 propiedades
      await cargarPaginaPropiedades();
    }

    // Consulta exacta del total usando head: true para no consumir ancho de banda
    async function consultarTotalContadorSupabase() {
      try {
        const filtros = obtenerValoresFiltros();
        let query = dbClient
          .from('propiedades')
          .select('*', { count: 'exact', head: true })
          .eq('estatus', 'Disponible');

        query = aplicarFiltrosAQuery(query, filtros);

        const { count, error } = await query;
        if (!error && count !== null) {
          document.getElementById('contadorPropiedades').textContent = count;
        }
      } catch (err) {
        console.error("Error al obtener contador de Supabase:", err);
      }
    }

    // Carga de datos con paginación de 12 en 12
    async function cargarPaginaPropiedades() {
      if (cargandoData || !hayMasRegistros) return;
      cargandoData = true;

      const msgEstado = document.getElementById('estadoMensaje');
      const btnCargarMas = document.getElementById('btnCargarMas');

      if (paginaActual === 0) msgEstado.classList.remove('hidden');

      const desde = paginaActual * LIMITE_POR_PAGINA;
      const hasta = desde + LIMITE_POR_PAGINA - 1;

      try {
        const filtros = obtenerValoresFiltros();
        let query = dbClient
          .from('propiedades')
          .select('*')
          .eq('estatus', 'Disponible')
          .order('destacado', { ascending: false }) // Posicionamiento de Destacados en la parte superior
          .order('id', { ascending: false })          // Orden secundario por lo más reciente
          .range(desde, hasta);

        query = aplicarFiltrosAQuery(query, filtros);

        const { data, error } = await query;

        if (error) throw error;

        msgEstado.classList.add('hidden');

        if (!data || data.length === 0) {
          if (paginaActual === 0) {
            document.getElementById('gridPropiedades').innerHTML = `
              <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-gray-200">
                <i class="fa-solid fa-building-circle-xmark text-4xl text-gray-400 mb-2"></i>
                <p class="text-gray-600 font-semibold text-sm">No se encontraron propiedades disponibles con los criterios seleccionados.</p>
              </div>
            `;
          }
          hayMasRegistros = false;
          btnCargarMas.classList.add('hidden');
          return;
        }

        if (data.length < LIMITE_POR_PAGINA) {
          hayMasRegistros = false;
          btnCargarMas.classList.add('hidden');
        } else {
          btnCargarMas.classList.remove('hidden');
          btnCargarMas.classList.add('flex');
        }

        renderizarTarjetas(data);
        paginaActual++;

      } catch (err) {
        console.error("Error al cargar propiedades de Supabase:", err);
        msgEstado.innerHTML = `<p class="text-red-600 text-xs font-bold">Ocurrió un error al consultar Supabase. Reintente.</p>`;
      } finally {
        cargandoData = false;
      }
    }

    function cargarMasPropiedades() {
      cargarPaginaPropiedades();
    }

    function obtenerValoresFiltros() {
      const params = new URLSearchParams(window.location.search);
      return {
        operacion: document.getElementById('filtroOperacion').value,
        tipo: document.getElementById('filtroTipo').value.trim(),
        ubicacion: document.getElementById('filtroUbicacion').value.trim(),
        codigo: document.getElementById('filtroCodigo').value.trim(),
        asesor: params.get('asesor') || ''
      };
    }

    function aplicarFiltrosAQuery(query, filtros) {
      if (filtros.operacion) query = query.eq('operacion', filtros.operacion);
      if (filtros.tipo) query = query.ilike('tipo', `%${filtros.tipo}%`);
      if (filtros.ubicacion) query = query.ilike('ubicacion', `%${filtros.ubicacion}%`);
      if (filtros.codigo) query = query.ilike('codigo_eco', `%${filtros.codigo}%`);
      if (filtros.asesor) query = query.eq('telefono_asesor', filtros.asesor);
      return query;
    }

    function aplicarFiltros() {
      inicializarCatalogo();
    }

    function aplicarFiltrosConDebounce() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        aplicarFiltros();
      }, 350);
    }

    function limpiarFiltros() {
      document.getElementById('filtroOperacion').value = '';
      document.getElementById('filtroTipo').value = '';
      document.getElementById('filtroUbicacion').value = '';
      document.getElementById('filtroCodigo').value = '';
      
      // Limpiar URL params si existen
      if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      inicializarCatalogo();
    }

    // Renderizado de las Tarjetas en el Grid
    function renderizarTarjetas(lista) {
      const container = document.getElementById('gridPropiedades');

      lista.forEach(item => {
        const esDestacado = Boolean(item.destacado);
        const primeraFoto = (item.fotos && item.fotos.length > 0) ? item.fotos[0] : 'https://via.placeholder.com/600x400?text=Sin+Imagen';
        const esAgencia = item.tipo_asesor === 'Agencia' && item.nombre_agencia;
        const nombreAsesorVisual = esAgencia ? `${item.nombre_asesor || 'Asesor'} (${item.nombre_agencia})` : (item.nombre_asesor || 'Asesor Independiente');

        const card = document.createElement('div');
        
        // Reconocimiento visual de destacados: Borde dorado y sombra especial
        card.className = `bg-white rounded-2xl overflow-hidden transition duration-300 hover:shadow-xl flex flex-col justify-between relative ${
          esDestacado 
            ? 'border-2 border-amber-400 ring-2 ring-amber-400/20 shadow-md' 
            : 'border border-gray-200 shadow-sm'
        }`;

        card.innerHTML = `
          <div class="relative">
            <!-- Insignia Dorada para Destacados -->
            ${esDestacado ? `
              <span class="absolute top-3 left-3 bg-gradient-to-r from-amber-500 to-yellow-500 text-white font-extrabold text-[10px] uppercase tracking-wider px-2.5 py-1 rounded-full shadow-md z-10 flex items-center gap-1">
                <i class="fa-solid fa-star text-amber-200"></i> Destacado
              </span>
            ` : ''}

            <span class="absolute top-3 right-3 bg-econexus-dark/80 backdrop-blur-md text-white font-bold text-xs px-2.5 py-1 rounded-full z-10">
              ${item.operacion}
            </span>

            <img src="${primeraFoto}" alt="${item.titulo}" class="w-full h-48 object-cover loading="lazy" />
          </div>

          <div class="p-4 flex-grow flex flex-col justify-between space-y-3">
            <div>
              <div class="flex justify-between items-start mb-1">
                <span class="text-[11px] font-bold text-econexus-accent uppercase tracking-wide">${item.tipo}</span>
                <span class="text-xs text-gray-500 font-mono font-bold">${item.codigo_eco}</span>
              </div>
              <h3 class="font-bold text-gray-900 text-sm line-clamp-2 leading-snug">${item.titulo}</h3>
              <p class="text-xs text-gray-500 mt-1 flex items-center">
                <i class="fa-solid fa-location-dot text-red-500 mr-1.5"></i> ${item.ubicacion}
              </p>
            </div>

            <div class="flex items-center justify-between text-xs text-gray-600 bg-gray-50 p-2 rounded-xl border border-gray-100">
              <span><i class="fa-solid fa-bed text-econexus mr-1"></i>${item.habitaciones || 0} Hab</span>
              <span><i class="fa-solid fa-bath text-econexus mr-1"></i>${item.banos || 0} Baños</span>
              <span><i class="fa-solid fa-ruler-combined text-econexus mr-1"></i>${item.metros || 0} m²</span>
            </div>

            <div class="pt-2 border-t border-gray-100 flex items-center justify-between">
              <div>
                <span class="text-[10px] text-gray-400 block uppercase font-semibold">Precio USD</span>
                <span class="text-lg font-extrabold text-econexus">$${Number(item.precio).toLocaleString('en-US')}</span>
              </div>
              
              <button type="button" onclick='abrirModalDetalle(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="bg-econexus hover:bg-econexus-light text-white font-bold px-3.5 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow">
                <span>Ver Ficha</span>
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Modal de Ficha Interactiva y Envíos a WhatsApp
    function abrirModalDetalle(item) {
      const container = document.getElementById('contenidoModalDetalle');
      const fotos = item.fotos && item.fotos.length > 0 ? item.fotos : ['https://via.placeholder.com/600x400?text=Sin+Imagen'];
      const esAgencia = item.tipo_asesor === 'Agencia' && item.nombre_agencia;
      const agenciaStr = esAgencia ? item.nombre_agencia : 'Agente Independiente';

      let galeriaHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">`;
      fotos.forEach((f, idx) => {
        galeriaHtml += `<img src="${f}" class="w-full h-40 object-cover rounded-xl border border-gray-200 ${idx === 0 ? 'sm:col-span-2 sm:h-60' : ''}" />`;
      });
      galeriaHtml += `</div>`;

      const numTelClean = item.telefono_asesor ? item.telefono_asesor.replace(/[^0-9]/g, '') : '584244466115';
      const urlFichaWeb = `${window.location.origin}${window.location.pathname}?codigo=${encodeURIComponent(item.codigo_eco)}`;
      
      const mensajeWA = encodeURIComponent(
        `Hola ${item.nombre_asesor || 'Asesor'}, estoy interesado en la propiedad *${item.titulo}* (Código: ${item.codigo_eco}) con precio de $${Number(item.precio).toLocaleString('en-US')}. Vi su publicación en EcoNexus: ${urlFichaWeb}`
      );

      container.innerHTML = `
        <div class="flex justify-between items-start border-b pb-3 pr-8">
          <div>
            <span class="text-xs font-bold text-econexus bg-green-100 px-2.5 py-0.5 rounded-full">${item.codigo_eco}</span>
            <h2 class="text-lg font-bold text-gray-900 mt-1">${item.titulo}</h2>
            <p class="text-xs text-gray-500">${item.ubicacion} | ${item.operacion}</p>
          </div>
          <div class="text-right">
            <span class="text-xl font-black text-econexus">$${Number(item.precio).toLocaleString('en-US')}</span>
          </div>
        </div>

        ${galeriaHtml}

        <div class="grid grid-cols-4 gap-2 bg-gray-50 p-3 rounded-xl text-center text-xs text-gray-700 border border-gray-200">
          <div><p class="font-bold text-gray-400 text-[10px]">HABITACIONES</p><p class="font-extrabold text-sm text-econexus">${item.habitaciones || 0}</p></div>
          <div><p class="font-bold text-gray-400 text-[10px]">BAÑOS</p><p class="font-extrabold text-sm text-econexus">${item.banos || 0}</p></div>
          <div><p class="font-bold text-gray-400 text-[10px]">PUESTOS</p><p class="font-extrabold text-sm text-econexus">${item.estacionamientos || 0}</p></div>
          <div><p class="font-bold text-gray-400 text-[10px]">ÁREA</p><p class="font-extrabold text-sm text-econexus">${item.metros || 0} m²</p></div>
        </div>

        <div>
          <h4 class="text-xs font-bold text-gray-800 uppercase mb-1">Descripción</h4>
          <p class="text-xs text-gray-600 leading-relaxed whitespace-pre-line bg-gray-50 p-3 rounded-xl border border-gray-200">${item.descripcion || 'Sin descripción disponible.'}</p>
        </div>

        <div class="bg-green-50 border border-green-200 rounded-xl p-3 flex justify-between items-center text-xs">
          <div>
            <p class="font-bold text-green-900">${item.nombre_asesor || 'Asesor Inmobiliario'}</p>
            <p class="text-green-700 text-[11px]">${agenciaStr}</p>
          </div>
          <a href="https://wa.me/${numTelClean}?text=${mensajeWA}" target="_blank" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-2 rounded-xl transition flex items-center gap-1.5 shadow">
            <i class="fa-brands fa-whatsapp text-sm"></i> Contactar Asesor
          </a>
        </div>
      `;

      document.getElementById('modalDetalle').classList.remove('hidden');
    }

    function cerrarModalDetalle() {
      document.getElementById('modalDetalle').classList.add('hidden');
    }
  </script>
</body>
</html>
