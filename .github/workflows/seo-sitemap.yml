name: Motor SEO EcoNexus

on:
  schedule:
    - cron: '0 2 * * *' # Ejecución diaria a las 2:00 AM UTC
  workflow_dispatch: # Permite ejecución manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar Repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Ejecutar Generador SEO y Catalogo Meta
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node generate-seo-pages.js

      - name: Guardar Cambios Automáticos
        run: |
          git config --global user.name "EcoNexus SEO Bot"
          git config --global user.email "seo-bot@econexus.com"
          git add inmueble/ sitemap.xml facebook-catalog.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "SEO & Meta Catalog: Generación de landings, sitemap y catalog XML actualizados" && git push)
