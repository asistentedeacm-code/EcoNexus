name: Deploy Protegido y Blindado EcoNexus

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar herramientas de minificación y ofuscación
        run: npm install html-minifier-terser javascript-obfuscator -g

      - name: Generar versión de producción protegida y ofuscada
        run: |
          mkdir dist
          
          # Copiamos archivos estáticos y multimedia esenciales
          cp logo.png.png dist/ 2>/dev/null || :
          cp manifest.json dist/ 2>/dev/null || :
          cp sw.js dist/ 2>/dev/null || :
          cp robots.txt dist/ 2>/dev/null || :
          cp sitemap.xml dist/ 2>/dev/null || :
          cp google15bf6eb9b02aca13.html dist/ 2>/dev/null || :
          
          # Minificamos y ofuscamos los archivos HTML principales y sus scripts internos
          html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true index.html -o dist/index.html
          html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true captacion.html -o dist/captacion.html
          html-minifier-terser --collapse-whitespace --remove-comments --minify-js true --minify-css true menu.html -o dist/menu.html

      - name: Desplegar a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
