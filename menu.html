<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Rápido | EcoNexus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e4d2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        /* --- CONTENEDOR DEL LOGO Y PALABRAS FLOTANTES --- */
        .logo-wrapper {
            position: relative;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .logo {
            width: 180px;
            height: auto;
            position: relative;
            z-index: 2; /* Mantiene el logo por encima de las palabras */
        }

        /* Estilos de las palabras flotantes (sin recuadro) */
        .floating-word {
            position: absolute;
            color: #a8d5ba; /* Verde claro corporativo */
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none; /* Evita que estorben si el usuario toca la pantalla */
            animation: orbital-float 6s ease-in-out infinite;
            z-index: 1;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Posiciones y tiempos independientes para cada palabra */
        .w1 { top: 5%; left: -45px; animation-delay: 0s; }
        .w2 { top: 40%; right: -55px; animation-delay: 1.2s; }
        .w3 { bottom: 15%; left: -50px; animation-delay: 2.4s; }
        .w4 { bottom: 25%; right: -40px; animation-delay: 3.6s; }
        .w5 { top: -15px; right: 10px; animation-delay: 4.8s; }
        .w6 { bottom: -20px; left: 20px; animation-delay: 6.0s; }

        /* Animación orbital de aparición y desaparición de las palabras */
        @keyframes orbital-float {
            0% { opacity: 0; transform: translateY(10px) scale(0.9); }
            30% { opacity: 0.7; transform: translateY(0) scale(1.05); }
            70% { opacity: 0.7; transform: translateY(-10px) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }
        
        /* --- RESTO DE LA INTERFAZ --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 350px;
            gap: 20px;
            z-index: 10;
        }
        
        .btn {
            background-color: #ffffff;
            color: #1e4d2e;
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        /* Contenedor que maneja el flote constante de la tarjeta */
        .benefits-wrapper {
            margin-top: 40px;
            width: 100%;
            max-width: 380px;
            height: 160px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            animation: float-gentle 4s ease-in-out infinite alternate;
        }

        /* Tarjeta que maneja exclusivamente el desvanecimiento */
        .cloud-card {
            position: absolute;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.02));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 25px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            pointer-events: none;
        }

        .cloud-card.active {
            opacity: 1;
            transform: scale(1);
        }

        .cloud-card h3 {
            margin: 0 0 10px 0;
            color: #a8d5ba;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cloud-card p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.4;
            font-weight: 300;
        }

        @keyframes float-gentle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Logo central envuelto con las palabras flotantes -->
    <div class="logo-wrapper">
        <span class="floating-word w1">Casas</span>
        <span class="floating-word w2">Apartamentos</span>
        <span class="floating-word w3">Townhouses</span>
        <span class="floating-word w4">Edificios</span>
        <span class="floating-word w5">Locales</span>
        <span class="floating-word w6">Y más...</span>
        
        <img src="logo.png.png" alt="Logo EcoNexus" class="logo">
    </div>

    <!-- Botones de Acción -->
    <div class="menu-container">
        <a href="https://asistentedeacm-code.github.io/EcoNexus/captacion.html" class="btn">Publicar un Inmueble</a>
        <a href="https://asistentedeacm-code.github.io/EcoNexus/" class="btn">Ir Al Sistema</a>
    </div>

    <!-- Nubes de beneficios -->
    <div class="benefits-wrapper">
        <div class="cloud-card" id="cloud-card">
            <h3 id="cloud-title"></h3>
            <p id="cloud-text"></p>
        </div>
    </div>

    <script>
        const benefits = [
            { 
                title: "Contacto Directo", 
                text: "Cada inmueble va directo al WhatsApp del asesor. Cero desvíos." 
            },
            { 
                title: "Cero Inventario Fantasma", 
                text: "Catálogo 100% real y actualizado. Olvídate del: 'Le gustó a mi cliente, pero ya lo vendieron'." 
            },
            { 
                title: "Publicaciones VIP", 
                text: "Destaca la propiedad que necesitas vender en segundos y obtén 5 veces más vistas e interacción." 
            },
            { 
                title: "Publicación Gratuita", 
                text: "Sube propiedades en 30 segundos sin pagar mensualidades obligatorias." 
            },
            { 
                title: "Búsqueda Inteligente", 
                text: "Encuentra el inmueble que buscas en segundos, alternando entre nuestros filtros avanzados." 
            }
        ];

        const cloudCard = document.getElementById('cloud-card');
        const cloudTitle = document.getElementById('cloud-title');
        const cloudText = document.getElementById('cloud-text');
        
        let currentIndex = 0;
        
        function animateClouds() {
            // Fade out
            cloudCard.classList.remove('active');
            
            // Espera 1 segundo a que desaparezca
            setTimeout(() => {
                // Cambia el texto
                cloudTitle.innerText = benefits[currentIndex].title;
                cloudText.innerText = benefits[currentIndex].text;
                
                // Fade in
                cloudCard.classList.add('active');
                
                currentIndex = (currentIndex + 1) % benefits.length;
                
                // Mantiene el texto 7 segundos
                setTimeout(animateClouds, 7000);
                
            }, 1000); 
        }

        setTimeout(animateClouds, 500);
    </script>

</body>
</html>
