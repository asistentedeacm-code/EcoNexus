<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Rápido | EcoNexus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e4d2e; /* Verde corporativo de EcoNexus */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 40px;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 350px;
            gap: 20px;
        }
        .btn {
            background-color: #ffffff;
            color: #1e4d2e;
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Asegúrate de que el nombre del archivo coincida exactamente con tu imagen cargada -->
    <img src="1002053750.png" alt="Logo EcoNexus" class="logo">

    <div class="menu-container">
        <a href="https://asistentedeacm-code.github.io/EcoNexus/captacion.html" class="btn">Publicar un Inmueble</a>
        <a href="https://asistentedeacm-code.github.io/EcoNexus/" class="btn">Ir Al Sistema</a>
    </div>

</body>
</html>
