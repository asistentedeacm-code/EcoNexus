<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Rápido | EcoNexus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e4d2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
        }
        
        .logo {
            width: 180px;
            height: auto;
            margin-bottom: 40px;
            z-index: 10;
        }
        
        .menu-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 350px;
            gap: 20px;
            z-index: 10;
        }
        
        .btn {
            background-color: #ffffff;
            color: #1e4d2e;
            text-decoration: none;
            padding: 18px 20px;
            border-radius: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        /* Contenedor que maneja el flote constante sin interrumpirse */
        .benefits-wrapper {
            margin-top: 40px;
            width: 100%;
            max-width: 380px;
            height: 160px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            animation: float-gentle 4s ease-in-out infinite alternate;
        }

        /* Tarjeta que maneja exclusivamente el desvanecimiento */
        .cloud-card {
            position: absolute;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.02));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 25px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            
            opacity: 0;
            transform: scale(0.95);
            /* Transición alargada a 1 segundo para mayor suavidad */
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            pointer-events: none;
        }

        .cloud-card.active {
            opacity: 1;
            transform: scale(1);
        }

        .cloud-card h3 {
            margin: 0 0 10px 0;
            color: #a8d5ba;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cloud-card p {
            margin: 0;
            font-size: 1rem;
            line-height: 1.4;
            font-weight: 300;
        }

        @keyframes float-gentle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <img src="logo.png.png" alt="Logo EcoNexus" class="logo">

    <div class="menu-container">
        <a href="https://asistentedeacm-code.github.io/EcoNexus/captacion.html" class="btn">Publicar un Inmueble</a>
        <a href="https://asistentedeacm-code.github.io/EcoNexus/" class="btn">Ir Al Sistema</a>
    </div>

    <div class="benefits-wrapper">
        <div class="cloud-card" id="cloud-card">
            <h3 id="cloud-title"></h3>
            <p id="cloud-text"></p>
        </div>
    </div>

    <script>
        const benefits = [
            { 
                title: "Contacto Directo", 
                text: "Cada inmueble va directo al WhatsApp del asesor. Cero desvíos." 
            },
            { 
                title: "Cero Inventario Fantasma", 
                text: "Catálogo 100% real y actualizado. Olvídate del: 'Le gustó a mi cliente, pero ya lo vendieron'." 
            },
            { 
                title: "Publicaciones VIP", 
                text: "Destaca la propiedad que necesitas vender en segundos y obtén 5 veces más vistas e interacción." 
            },
            { 
                title: "Publicación Gratuita", 
                text: "Sube propiedades en 30 segundos sin pagar mensualidades obligatorias." 
            },
            { 
                title: "Búsqueda Inteligente", 
                text: "Encuentra el inmueble que buscas en segundos, alternando entre nuestros filtros avanzados." 
            }
        ];

        const cloudCard = document.getElementById('cloud-card');
        const cloudTitle = document.getElementById('cloud-title');
        const cloudText = document.getElementById('cloud-text');
        
        let currentIndex = 0;
        
        function animateClouds() {
            // 1. Inicia el desvanecimiento (fade out)
            cloudCard.classList.remove('active');
            
            // 2. Espera 1 segundo a que la tarjeta esté completamente invisible
            setTimeout(() => {
                // 3. Cambia el contenido
                cloudTitle.innerText = benefits[currentIndex].title;
                cloudText.innerText = benefits[currentIndex].text;
                
                // 4. Aparece de nuevo (fade in)
                cloudCard.classList.add('active');
                
                currentIndex = (currentIndex + 1) % benefits.length;
                
                // 5. Mantiene el texto visible durante 7 segundos antes de repetir
                setTimeout(animateClouds, 7000);
                
            }, 1000); 
        }

        setTimeout(animateClouds, 500);
    </script>

</body>
</html>
