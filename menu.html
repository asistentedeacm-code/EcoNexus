<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menú Rápido | EcoNexus</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1e4d2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EcoNexus"><link rel="apple-touch-icon" href="logo.png.png"><style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#1e4d2e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box;overflow:hidden}.logo-wrapper{position:relative;margin-bottom:50px;display:flex;justify-content:center;align-items:center;z-index:10}.logo{width:180px;height:auto;position:relative;z-index:2}.floating-word{position:absolute;color:#a8d5ba;font-size:.85rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:0;pointer-events:none;animation:orbital-float 6s ease-in-out infinite;z-index:1;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap}.w1{top:15%;left:-80px;animation-delay:0s}.w2{top:35%;right:-120px;animation-delay:1.2s}.w3{bottom:25%;left:-100px;animation-delay:2.4s}.w4{bottom:25%;right:-100px;animation-delay:3.6s}.w5{top:-25px;right:0;animation-delay:4.8s}.w6{bottom:-45px;left:10px;animation-delay:6s}@keyframes orbital-float{0%{opacity:0;transform:translateY(10px) scale(.9)}30%{opacity:.8;transform:translateY(0) scale(1.05)}70%{opacity:.8;transform:translateY(-10px) scale(1)}100%{opacity:0;transform:translateY(-20px) scale(.9)}}.menu-container{display:flex;flex-direction:column;width:100%;max-width:350px;gap:20px;z-index:10}.btn{background-color:#fff;color:#1e4d2e;text-decoration:none;padding:18px 20px;border-radius:30px;text-align:center;font-weight:700;font-size:1.1rem;box-shadow:0 4px 15px rgba(0,0,0,.3);transition:transform .2s,box-shadow .2s}.btn:active{transform:scale(.95)}.benefits-wrapper{margin-top:40px;width:100%;max-width:380px;height:160px;position:relative;display:flex;justify-content:center;align-items:center;z-index:5;animation:float-gentle 4s ease-in-out infinite alternate}.cloud-card{position:absolute;width:100%;box-sizing:border-box;background:linear-gradient(135deg,rgba(0,0,0,.35),rgba(0,0,0,.15));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:25px;color:#fff;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transform:scale(.95);transition:opacity 1s ease-in-out,transform 1s ease-in-out;pointer-events:none}.cloud-card.active{opacity:1;transform:scale(1)}.cloud-card h3{margin:0 0 10px 0;color:#a8d5ba;font-size:1.25rem;text-transform:uppercase;letter-spacing:1px;text-shadow:0 1px 3px rgba(0,0,0,.5)}.cloud-card p{margin:0;font-size:1rem;line-height:1.4;font-weight:400;text-shadow:0 1px 3px rgba(0,0,0,.5)}@keyframes float-gentle{0%{transform:translateY(0)}100%{transform:translateY(-10px)}}</style></head><body><div class="logo-wrapper"><span class="floating-word w1">Casas</span> <span class="floating-word w2">Apartamentos</span> <span class="floating-word w3">Townhouses</span> <span class="floating-word w4">Edificios</span> <span class="floating-word w5">Locales</span> <span class="floating-word w6">Y más...</span> <img src="logo.png.png" alt="Logo EcoNexus" class="logo"></div><div class="menu-container"><a href="https://asistentedeacm-code.github.io/EcoNexus/captacion.html" class="btn">Tu CRM Personalizado</a> <a href="https://asistentedeacm-code.github.io/EcoNexus/" class="btn">Ecosistema Inmobiliario</a><button id="btnInstalar" class="btn" style="display:none;cursor:pointer;border:none;font-family:inherit" onclick="instalarApp()">📲 Instalar Aplicación</button></div><div class="benefits-wrapper"><div class="cloud-card" id="cloud-card"><h3 id="cloud-title"></h3><p id="cloud-text"></p></div></div><script>const benefits=[{title:"Contacto Directo",text:"Cada inmueble va directo al WhatsApp del asesor. Cero desvíos."},{title:"Cero Inventario Fantasma",text:"Catálogo 100% real y actualizado. Olvídate del: 'Le gustó a mi cliente, pero ya lo vendieron'."},{title:"Publicaciones VIP",text:"Destaca la propiedad que necesitas vender en segundos y obtén 5 veces más vistas e interacción."},{title:"Publicación Gratuita",text:"Sube propiedades en 30 segundos sin pagar mensualidades obligatorias."},{title:"Búsqueda Inteligente",text:"Encuentra el inmueble que buscas en segundos, alternando entre nuestros filtros avanzados."}],cloudCard=document.getElementById("cloud-card"),cloudTitle=document.getElementById("cloud-title"),cloudText=document.getElementById("cloud-text");let deferredPrompt,currentIndex=0;function animateClouds(){cloudCard.classList.remove("active"),setTimeout(()=>{cloudTitle.innerText=benefits[currentIndex].title,cloudText.innerText=benefits[currentIndex].text,cloudCard.classList.add("active"),currentIndex=(currentIndex+1)%benefits.length,setTimeout(animateClouds,7e3)},1e3)}function instalarApp(){deferredPrompt?(deferredPrompt.prompt(),deferredPrompt.userChoice.then(e=>{"accepted"===e.outcome&&console.log("El usuario aceptó la instalación."),deferredPrompt=null})):alert('Para instalar en iPhone/iPad: toca el botón "Compartir" de Safari y selecciona "Agregar a inicio".')}setTimeout(animateClouds,500),"serviceWorker"in navigator&&window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").then(e=>console.log("Service Worker registrado correctamente",e)).catch(e=>console.error("Error al registrar Service Worker",e))}),window.addEventListener("beforeinstallprompt",e=>{e.preventDefault(),deferredPrompt=e;const t=document.getElementById("btnInstalar");t&&(t.style.display="block")})</script></body></html>
